[project]
name = "mhsb"
version = "0.1.0"
description = "Personal website and portfolio for Michael Ball (mhsb.me)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Michael Ball", email = "michael.h.s.ball@gmail.com" }]
keywords = ["portfolio", "flask", "mhsb"]
dependencies = [
    "Flask>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "gunicorn>=22,<24",
]

[project.urls]
Homepage = "https://mhsb.me"
Repository = "https://github.com/michaelhball/mhsb"

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    "pre-commit>=4.6,<5",
    "pytest>=9.0,<10",
    "pytest-sugar>=1.1,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "TID", "UP", "B"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
order-by-type = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
