name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build CSS (Dart Sass compiles cleanly)
        run: npx --yes sass@1 app/static/scss/main.scss /tmp/compiled.css --no-source-map --style=compressed
